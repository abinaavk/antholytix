<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antholytix — Anthocyanin Freshness &amp; Authenticity Scanner</title>
<meta name="description" content="Scan the pigment strip and QR code on an Antholytix label to check freshness and authenticity in seconds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23C23E86'/%3E%3Cstop offset='.5' stop-color='%233F70DA'/%3E%3Cstop offset='1' stop-color='%23D9A62E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div id="app">

  <!-- ============ SIDEBAR (desktop) ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-word">Antholytix</div>
        <div class="brand-sub">Freshness &amp; authenticity</div>
      </div>
    </div>

    <nav class="navlist" id="sidebar-nav">
      <a class="navlink" data-route="home" href="#/home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Home
      </a>
      <a class="navlink" data-route="scan" href="#/scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3m12-4v3a1 1 0 0 1-1 1h-3"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>
        Scan label
      </a>
      <a class="navlink" data-route="products" href="#/products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 7.5 12 3 3.5 7.5 12 12l8.5-4.5Z"/><path d="M3.5 7.5v9L12 21l8.5-4.5v-9"/><path d="M12 12v9"/></svg>
        Products
      </a>
      <a class="navlink" data-route="history" href="#/history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
        Scan history
      </a>
      <a class="navlink" data-route="about" href="#/about">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5"/><path d="M12 8h.01"/></svg>
        How it works
      </a>
    </nav>

    <div class="sidebar-foot">
      <p>Anthocyanin pigment shifts colour with pH — that's the same chemistry your label uses to flag spoilage.</p>
      <div class="spectrum-mini"></div>
    </div>
  </aside>

  <!-- ============ MAIN COLUMN ============ -->
  <div class="main-col">
    <header class="topbar">
      <div class="mobile-brand">
        <div class="brand-mark"></div>
        <div class="brand-word">Antholytix</div>
      </div>
      <div>
        <div class="topbar-title" id="topbar-title">Home</div>
        <div class="topbar-sub" id="topbar-sub">Welcome back</div>
      </div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="btn-search" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="btn-alerts" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="dot" id="alert-dot"></span>
      </button>
      <button class="avatar-btn" id="btn-avatar" aria-label="Account">AL</button>
    </header>

    <!-- ============ HOME VIEW ============ -->
    <main class="view active" data-view="home" id="view-home"></main>

    <!-- ============ SCAN VIEW ============ -->
    <main class="view" data-view="scan" id="view-scan"></main>

    <!-- ============ PRODUCTS VIEW ============ -->
    <main class="view" data-view="products" id="view-products"></main>

    <!-- ============ HISTORY VIEW ============ -->
    <main class="view" data-view="history" id="view-history"></main>

    <!-- ============ ABOUT VIEW ============ -->
    <main class="view" data-view="about" id="view-about"></main>
  </div>

  <!-- ============ BOTTOM NAV (mobile) ============ -->
  <nav class="bottomnav" id="bottom-nav">
    <a class="bn-item" data-route="home" href="#/home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Home
    </a>
    <a class="bn-item" data-route="products" href="#/products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 7.5 12 3 3.5 7.5 12 12l8.5-4.5Z"/><path d="M3.5 7.5v9L12 21l8.5-4.5v-9"/><path d="M12 12v9"/></svg>
      Shop
    </a>
    <a class="bn-scan" data-route="scan" href="#/scan" aria-label="Scan a label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M20 8V5a1 1 0 0 0-1-1h-3M4 16v3a1 1 0 0 0 1 1h3m12-4v3a1 1 0 0 1-1 1h-3"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
    </a>
    <a class="bn-item" data-route="history" href="#/history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
      History
    </a>
    <a class="bn-item" data-route="about" href="#/about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5"/><path d="M12 8h.01"/></svg>
      Guide
    </a>
  </nav>

  <!-- ============ MODAL / TOAST MOUNTS ============ -->
  <div class="modal-backdrop" id="modal-mount"></div>
  <div class="toast-wrap" id="toast-mount"></div>
  <canvas id="hidden-canvas" style="display:none;"></canvas>
</div>
<script>
  window.ANTHOLYTIX_API_BASE = "{{ api_base }}";
</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
